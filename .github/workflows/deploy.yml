name: Build

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Get version
        id: ver
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Package
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          mkdir -p pkg
          cp -r server/ shared/ public/ package.json package-lock.json pkg/
          cp scripts/restart-n150.sh pkg/restart.sh
          cd pkg && npm ci --omit=dev && cd ..
          # 移除大体积二进制：ffmpeg/ffprobe 用 N150 系统版（apt），puppeteer 用系统 Chromium
          rm -rf pkg/node_modules/@ffmpeg-installer pkg/node_modules/@ffprobe-installer
          echo "${{ steps.ver.outputs.sha }}" > pkg/.version
          tar -czf wemusic.tar.gz -C pkg .
          ls -lh wemusic.tar.gz

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.sha }}
          name: ${{ steps.ver.outputs.sha }}
          body: "Auto build ${{ steps.ver.outputs.sha }}"
          files: wemusic.tar.gz
          prerelease: true

      # 同步上传到 Cloudflare R2（2026-10-15）：N150 在大陆，出境到 GitHub 只剩约
      # 3.5KB/s（ghproxy 镜像已废、直连不通），产物稍大就永远下不完，部署陷入
      # 无限重试。R2 走 Cloudflare 通道实测约 698KB/s，deploy-agent 会优先从这拉。
      # continue-on-error：R2 没配凭据时只是跳过上传，发布与部署照旧（自动回退）。
      - name: Upload to R2
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # 自定义 endpoint 必须显式给 region，aws cli 否则会报 "You must specify a region"
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          if [ -z "${R2_BUCKET:-}" ] || [ -z "${R2_ACCOUNT_ID:-}" ]; then
            echo "R2 未配置（缺 R2_BUCKET / R2_ACCOUNT_ID），跳过上传"
            exit 0
          fi
          ENDPOINT="${R2_ENDPOINT:-https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com}"
          aws s3 cp wemusic.tar.gz \
            "s3://${R2_BUCKET}/wemusic/${{ steps.ver.outputs.sha }}/wemusic.tar.gz" \
            --endpoint-url "$ENDPOINT"
          echo "✓ 已上传到 R2"

      - name: Notify N150
        continue-on-error: true
        run: |
          sleep 20
          curl -sS -X POST https://wemusic.sherlockguo.com/deploy \
            -H "Content-Type: application/json" \
            -d "{\"project\":\"wemusic\",\"version\":\"${{ steps.ver.outputs.sha }}\"}" \
            --max-time 10 --connect-timeout 5 || true
